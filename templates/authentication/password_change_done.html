{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Password Changed" %} | {{ station_name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto text-center py-12">
    <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center mx-auto text-2xl mb-4">
        ✅
    </div>
    <h2 class="text-2xl font-bold text-slate-900 mb-2">{% trans "Password Changed Successfully" %}</h2>
    <p class="text-sm text-slate-600 mb-6">{% trans "Your login credentials have been updated." %}</p>
    <a href="{% url 'dashboard:index' %}" class="btn btn-primary">
        {% trans "Return to Dashboard" %}
    </a>
</div>
{% endblock %}
