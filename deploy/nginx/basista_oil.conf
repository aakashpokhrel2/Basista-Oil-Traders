# ==============================================================================
# Nginx Configuration: Basista Oil Traders Petrol Station System
# Domain: petrol.basistaoil.com.np
# ==============================================================================

# Gunicorn UNIX socket upstream
upstream petrol_station_upstream {
    server unix:/run/gunicorn/basista_oil.sock fail_timeout=0;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server - Port 80
# Redirects all HTTP traffic to HTTPS, serves Let's Encrypt ACME challenges
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name petrol.basistaoil.com.np www.petrol.basistaoil.com.np;

    # Let's Encrypt ACME Challenge verification path
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        default_type "text/plain";
    }

    # Redirect all other HTTP requests to HTTPS permanently (301)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server - Port 443 (HTTP/2 Enabled)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name petrol.basistaoil.com.np www.petrol.basistaoil.com.np;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/petrol.basistaoil.com.np/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/petrol.basistaoil.com.np/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/petrol.basistaoil.com.np/chain.pem;

    # SSL Protocol & Modern Cipher Suite (Mozilla Modern Profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # SSL Session Caching & Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Request size limits (Allows large PDF exports and image attachments)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Timeouts
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 65;
    send_timeout 30s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Access and Error Logs
    access_log /var/log/nginx/petrol_station_access.log combined;
    error_log /var/log/nginx/petrol_station_error.log warn;

    # --------------------------------------------------------------------------
    # Static Files Handling
    # Served directly by Nginx with client-side caching
    # --------------------------------------------------------------------------
    location /static/ {
        alias /var/www/basista_oil/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Media Files Handling (User uploads, station logo, scanned receipts)
    # Strictly non-executable: prevent script execution inside uploads
    # --------------------------------------------------------------------------
    location /media/ {
        alias /var/www/basista_oil/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        # Prevent execution of any scripts uploaded to media
        location ~ \.(php|py|sh|pl|cgi)$ {
            deny all;
        }
    }

    # Favicon and Robots
    location = /favicon.ico {
        alias /var/www/basista_oil/static/favicon.ico;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        alias /var/www/basista_oil/static/robots.txt;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # Gunicorn Reverse Proxy Application Pass
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://petrol_station_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSockets / HTMX streaming support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffer and timeout configurations
        proxy_redirect off;
        proxy_buffering on;
        proxy_buffers 8 64k;
        proxy_buffer_size 128k;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
